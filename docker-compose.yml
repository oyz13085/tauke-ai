services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tauke
      POSTGRES_PASSWORD: tauke_pass
      POSTGRES_DB: taukeai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads

volumes:
  postgres_data:
